---
name: macOS (Apple Silicon)
concurrency:
  group: pr-ci-macos.yml-${{ github.event_name }}-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: true
jobs:
  ci_changes:
    name: Select validation paths
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    outputs:
      run_validation: "${{ steps.paths.outputs.run_validation }}"
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      with:
        persist-credentials: false
    - id: paths
      env:
        GH_TOKEN: "${{ github.token }}"
        CI_INCLUDE_PATHS: '["qeth/**","tests/**","pyproject.toml","uv.lock","dist/macos/**"]'
        CI_IGNORE_PATHS: "[]"
      run: python3 .github/scripts/ci_changes.py
  tests:
    runs-on: macos-15
    steps:
    - uses: actions/checkout@v4
    - name: Install uv
      uses: astral-sh/setup-uv@v9.0.0
      with:
        enable-cache: true
    - name: Environment
      run: |
        sw_vers
        echo "arch: $(uname -m)"
        uv --version
    - name: Install
      run: uv sync --all-extras
    - name: Versions under test
      run: |
        uv run python -c "import sys, platform; print(sys.version); print(platform.platform(), platform.machine())"
        uv run python -c "import PySide6; from PySide6 import QtCore; print('PySide6', PySide6.__version__, 'Qt', QtCore.qVersion())"
        uv run python -c "import qeth; print('qeth', qeth.__version__)"
    - name: Test suite
      run: uv run pytest -vv -o faulthandler_timeout=120
    - name: Ruff
      if: always()
      run: uv run ruff check qeth/ tests/
    - name: mypy
      if: always()
      run: uv run mypy
    needs:
    - ci_changes
    if: "${{ needs.ci_changes.outputs.run_validation == 'true' }}"
  bundle:
    runs-on: macos-15
    steps:
    - uses: actions/checkout@v4
    - name: Install uv
      uses: astral-sh/setup-uv@v9.0.0
      with:
        enable-cache: true
    - name: Fetch Helios (darwin arm64)
      run: |
        set -euo pipefail
        curl -fsSL -o /tmp/helios.tar.gz \
          https://github.com/a16z/helios/releases/download/0.11.1/helios_darwin_arm64.tar.gz
        tar -xzf /tmp/helios.tar.gz -C /tmp
        chmod +x /tmp/helios
        /tmp/helios --version
    - name: Signing configured?
      id: signing
      env:
        CERT_P12: "${{ secrets.MACOS_CERT_P12 }}"
        API_KEY: "${{ secrets.APPLE_API_KEY_P8 }}"
      run: |
        if [ -n "${CERT_P12:-}" ] && [ -n "${API_KEY:-}" ]; then
          echo "enabled=true" >> "$GITHUB_OUTPUT"
          echo "Developer ID signing + notarization ENABLED"
        else
          echo "enabled=false" >> "$GITHUB_OUTPUT"
          echo "No signing secrets — building ad-hoc signed (not notarized)"
        fi
    - name: Import the Developer ID certificate
      if: steps.signing.outputs.enabled == 'true'
      env:
        CERT_P12: "${{ secrets.MACOS_CERT_P12 }}"
        CERT_PASSWORD: "${{ secrets.MACOS_CERT_PASSWORD }}"
      run: |
        set -euo pipefail
        # A throwaway keychain, so nothing touches the runner's login one.
        KEYCHAIN=$RUNNER_TEMP/qeth-signing.keychain-db
        KEYCHAIN_PW=$(openssl rand -hex 24)
        security create-keychain -p "$KEYCHAIN_PW" "$KEYCHAIN"
        security set-keychain-settings -lut 21600 "$KEYCHAIN"
        security unlock-keychain -p "$KEYCHAIN_PW" "$KEYCHAIN"
        printf '%s' "$CERT_P12" | base64 --decode > "$RUNNER_TEMP/cert.p12"
        security import "$RUNNER_TEMP/cert.p12" -k "$KEYCHAIN" \
          -P "$CERT_PASSWORD" -T /usr/bin/codesign -T /usr/bin/security
        rm -f "$RUNNER_TEMP/cert.p12"
        # Without this, codesign blocks on a GUI prompt that never comes.
        security set-key-partition-list -S apple-tool:,apple: \
          -s -k "$KEYCHAIN_PW" "$KEYCHAIN" >/dev/null
        security list-keychains -d user -s "$KEYCHAIN" $(security list-keychains -d user | tr -d '"')
        IDENTITY=$(security find-identity -v -p codesigning "$KEYCHAIN" \
          | grep "Developer ID Application" | head -1 | sed -E 's/.*"(.*)".*/\1/')
        [ -n "$IDENTITY" ] || { echo "::error::no Developer ID Application identity in the .p12"; exit 1; }
        echo "SIGN_IDENTITY=$IDENTITY" >> "$GITHUB_ENV"
        echo "SIGN_KEYCHAIN=$KEYCHAIN" >> "$GITHUB_ENV"
        echo "signing identity: $IDENTITY"
    - name: Install libusb (Trezor)
      run: brew install libusb
    - name: Build qeth-macos.app
      run: "./dist/macos/build.sh"
    - name: Build qeth-verify-macos.app
      run: QETH_BUNDLE_HELIOS=/tmp/helios ./dist/macos/build.sh
    - name: Sign the bundles (Developer ID)
      if: steps.signing.outputs.enabled == 'true'
      run: |
        set -euo pipefail
        for APP in dist/macos/out/qeth-macos.app dist/macos/out/qeth-verify-macos.app; do
          codesign --force --deep --options runtime --timestamp \
            --entitlements dist/macos/qeth.entitlements \
            --keychain "$SIGN_KEYCHAIN" --sign "$SIGN_IDENTITY" "$APP"
          codesign --verify --deep --strict --verbose=2 "$APP"
          # Gatekeeper still rejects here — the ticket only exists after
          # notarization + stapling below. Informational only.
          spctl -a -vvv -t exec "$APP" 2>&1 | sed "s/^/  spctl: /" || true
        done
    - name: Verify the bundle
      run: |
        set -euo pipefail
        for APP in dist/macos/out/qeth-macos.app dist/macos/out/qeth-verify-macos.app; do
        test -d "$APP" || { echo "::error::no bundle produced: $APP"; exit 1; }
        PLIST="$APP/Contents/Info.plist"

        /usr/libexec/PlistBuddy -c 'Print :NSCameraUsageDescription' "$PLIST"
        /usr/libexec/PlistBuddy -c 'Print :CFBundleIdentifier' "$PLIST"

        codesign -d --entitlements - --xml "$APP" 2>/dev/null \
          | grep -q 'com.apple.security.device.camera' \
          || { echo "::error::camera entitlement missing"; exit 1; }
        codesign --verify --deep --strict "$APP"

        # The macOS multimedia backend. Named libdarwinmediaplugin.dylib in
        # Qt 6 — without it QCamera finds no device and the scanner hangs.
        find "$APP" -name 'libdarwinmediaplugin.dylib' | grep -q . \
          || { echo "::error::Darwin media plugin missing"; exit 1; }
        # QR decode, and the seed the token list falls back on.
        find "$APP" -name 'zxingcpp*.so' | grep -q . \
          || { echo "::error::zxingcpp missing"; exit 1; }
        find "$APP" -name 'top_tokens.json' | grep -q . \
          || { echo "::error::bundled top-tokens seed missing"; exit 1; }
        # Trezor: without the bundled libusb, trezorlib finds no device.
        find "$APP" -name 'libusb-1.0*.dylib' | grep -q . \
          || { echo "::error::libusb (Trezor) missing"; exit 1; }

        # Pure-Python packages live in the embedded PYZ, not on disk, so
        # check the archive rather than the filesystem: `eth` is py-evm,
        # whose absence would silently cost the pre-broadcast preview.
        uv run --with pyinstaller python -m PyInstaller.utils.cliutils.archive_viewer \
          --list --recursive "$APP/Contents/MacOS/qeth" > /tmp/pyz.txt
        for mod in web3 "eth\." ledgereth trezorlib; do
          grep -q "'$mod" /tmp/pyz.txt \
            || { echo "::error::$mod not in the bundle"; exit 1; }
        done

        lipo -info "$APP/Contents/MacOS/qeth"

        # helios belongs in the verify bundle and NOWHERE else: a normal
        # build that quietly shipped it would mislabel what users downloaded.
        if [ "$APP" = "dist/macos/out/qeth-verify-macos.app" ]; then
          find "$APP" -name helios -type f | grep -q . \
            || { echo "::error::verify bundle has no helios"; exit 1; }
        else
          find "$APP" -name helios -type f | grep -q . \
            && { echo "::error::helios leaked into the normal bundle"; exit 1; }
        fi
        echo "verified: $APP"
        done
    - name: Package as a disk image
      run: |
        set -euo pipefail
        for v in qeth-macos qeth-verify-macos; do
          # hdiutil intermittently fails the SECOND create in a row with
          # "Resource busy" — the previous image's resources aren't released
          # yet. Retry rather than fail a release build on a known flake.
          for attempt in 1 2 3 4 5; do
            if hdiutil create -volname "$v" -srcfolder "dist/macos/out/$v.app" \
                 -ov -format UDZO "dist/macos/out/$v.dmg"; then
              break
            fi
            [ "$attempt" = 5 ] && { echo "::error::hdiutil create failed for $v after 5 attempts"; exit 1; }
            echo "hdiutil busy — retry $attempt for $v"
            sleep 10
          done
        done
        ls -lh dist/macos/out/*.dmg
    - name: Verify the image round-trips
      run: |
        set -euo pipefail
        for v in qeth-macos qeth-verify-macos; do
          MNT=$(mktemp -d)
          hdiutil attach "dist/macos/out/$v.dmg" -mountpoint "$MNT" -nobrowse -quiet
          codesign --verify --deep --strict "$MNT/$v.app"
          find "$MNT/$v.app" -type l | wc -l | xargs echo "$v symlinks preserved:"
          hdiutil detach "$MNT" -quiet
        done
        echo "disk images verified"
    - name: Notarize and staple
      if: steps.signing.outputs.enabled == 'true'
      env:
        API_KEY_ID: "${{ secrets.APPLE_API_KEY_ID }}"
        API_ISSUER_ID: "${{ secrets.APPLE_API_ISSUER_ID }}"
        API_KEY_P8: "${{ secrets.APPLE_API_KEY_P8 }}"
      run: |
        set -euo pipefail
        printf '%s' "$API_KEY_P8" | base64 --decode > "$RUNNER_TEMP/api.p8"
        trap 'rm -f "$RUNNER_TEMP/api.p8"' EXIT
        for v in qeth-macos qeth-verify-macos; do
          DMG="dist/macos/out/$v.dmg"
          # Sign the image itself too, so the container is trusted as well.
          codesign --force --timestamp --keychain "$SIGN_KEYCHAIN" \
            --sign "$SIGN_IDENTITY" "$DMG"
          # --wait blocks until Apple returns a verdict (usually minutes). A
          # rejection fails the step; `notarytool log` names the offending
          # binary, which for a PyInstaller app is usually an entitlement gap.
          xcrun notarytool submit "$DMG" --wait \
            --key "$RUNNER_TEMP/api.p8" --key-id "$API_KEY_ID" \
            --issuer "$API_ISSUER_ID"
          xcrun stapler staple "$DMG"
          xcrun stapler validate "$DMG"
          # THE check that matters: Gatekeeper must now accept a fresh
          # download. If this rejects, users still see the quarantine wall.
          spctl -a -vvv -t open --context context:primary-signature "$DMG"
          echo "notarized + stapled: $DMG"
        done
    - name: Upload the disk image
      uses: actions/upload-artifact@v4
      with:
        name: qeth-macos-dmg
        path: dist/macos/out/*.dmg
        retention-days: 14
        if-no-files-found: error
    needs:
    - ci_changes
    if: "${{ needs.ci_changes.outputs.run_validation == 'true' }}"
  ci_gate:
    name: CI (macos.yml)
    if: "${{ !cancelled() }}"
    needs:
    - ci_changes
    - tests
    - bundle
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      with:
        persist-credentials: false
    - name: Verify validation contract
      env:
        CI_GATE_NEEDS: "${{ toJSON(needs) }}"
        CI_EXPECTED_JOBS: '["tests","bundle"]'
      run: |-
        python3 -m unittest discover -s .github/scripts -p test_ci_contract.py
        python3 .github/scripts/ci_gate.py
'on':
  workflow_dispatch:
  push:
    branches:
    - master
    paths:
    - qeth/**
    - tests/**
    - pyproject.toml
    - uv.lock
    - dist/macos/**
    - ".github/workflows/macos.yml"
  pull_request: {}
